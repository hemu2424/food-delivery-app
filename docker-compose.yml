
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food-delivery-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in the server .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the server .env file}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in the server .env file}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL in the server .env file}

      EMAIL_USER: ${EMAIL_USER-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD-}
      EMAIL_FROM: ${EMAIL_FROM-}
      Email_to: ${Email_to-}
      BREVO_API_KEY: ${BREVO_API_KEY-}
      RESEND_API_KEY: ${RESEND_API_KEY-}
      GMAIL_USER: ${GMAIL_USER-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN-}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET-}

      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY-}
      MAPTILER_API_KEY: ${MAPTILER_API_KEY-}

      SMTP_HOST: ${SMTP_HOST-}
      SMTP_PORT: ${SMTP_PORT-}
      SMTP_USER: ${SMTP_USER-}
      SMTP_PASS: ${SMTP_PASS-}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET-}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - food-delivery-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in the server .env file}
    container_name: food-delivery-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in the server .env file}
      INTERNAL_API_URL: http://backend:5000/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - food-delivery-network

networks:
  food-delivery-network:
    driver: bridge
