services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: food-delivery-backend-dev
    restart: unless-stopped
    tty: true
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: ${MONGO_URI}
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3002}
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    tty: true
    ports:
      - "3002:3002"
    depends_on:
      - backend
    command: npm run dev:admin
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
